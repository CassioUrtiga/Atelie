<div class="modal fade" id="modalPagamento{{ pedido.id }}" tabindex="-1" role="dialog" aria-labelledby="exampleModalLongTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLongTitle">Realizar pagamento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-4 text-center p-3 border border-dashed rounded bg-light">
                    {% if pix %}
                        <img 
                            src="{{ pedido.pix_qrcode.url }}" 
                            class="galeria-img" 
                            style="width: 250px; height: auto;"
                            alt="Qrcode" 
                            draggable="false"
                            oncontextmenu="return false;"
                        >
                        <h4>Pix: <span class="badge text-bg-secondary">{{ pix.chave }}</span></h4>
                    {% else %}
                        <h4>Nenhuma chave pix foi cadastrada no sistema</h4>
                    {% endif %}
                </div>
            </div>
                <div class="modal-footer bg-light border-top-0 d-flex w-100 gap-2 m-0 p-3">
                    <button type="button" class="btn btn-secondary flex-fill" data-bs-dismiss="modal">
                        Fechar
                    </button>
                </div>
        </div>
    </div>
</div>
