<div class="modal fade" id="modalPagamentos" tabindex="-1" role="dialog" aria-labelledby="exampleModalLongTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLongTitle">Gerenciar Pagamentos</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form action="{% url 'pagamento' %}" id="formularioPagamentos" method="post" autocomplete="off">
                {% csrf_token %}
                <div class="modal-body p-4">                  
                    <div class="row g-3">
                        <div class="border border-secondary-subtle rounded-3 p-3 bg-light shadow-sm mb-4">
                            <div class="form-label fw-semibold text-secondary">Método de pagamento</div>

                            <label for="nome" class="form-label fw-semibold text-secondary small">Nome</label>
                            <input type="text" class="form-control" id="nome" name="nome" placeholder="Informe um nome">

                            <label for="chave_Pix" class="form-label fw-semibold text-secondary small">Pix</label>
                            <input type="text" class="form-control" id="chave_Pix" name="chavePix" placeholder="Informe a chave Pix">
                        </div>
                        {% if pix %}
                            <div class="border border-secondary-subtle rounded-3 p-3 bg-light shadow-sm mb-4">
                                <div class="form-label fw-semibold text-secondary">Pix cadastrado</div>
                                <h5>{{ pix.nome|capfirst }} <span class="badge text-bg-secondary">{{ pix.chave }}</span></h5>
                            </div>
                        {% endif %}
                    </div>
                </div>
                <div class="modal-footer bg-light border-top-0 d-flex w-100 gap-2 m-0 p-3">
                    <button type="submit" class="btn btn-primary col">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
