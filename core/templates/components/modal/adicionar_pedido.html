<div class="modal fade" id="modalPedido" tabindex="-1" role="dialog" aria-labelledby="exampleModalLongTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLongTitle">Realizar Novo Pedido</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form action="{% url 'pedido' %}" id="formularioPedido" method="post" enctype="multipart/form-data" autocomplete="off">
                {% csrf_token %}
                <div class="modal-body p-4">
                    <div class="mb-4 text-center p-3 border border-dashed rounded bg-light">
                        <div id="novaImagem" class="mb-2"></div>
                        <button type="button" class="btn btn-outline-primary btn-sm d-inline-flex align-items-center justify-content-center gap-2" id="addImg">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-lg" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/>
                            </svg>
                            <span>Adicionar Imagem</span>
                        </button>
                    </div>
                    <div class="row g-3">
                        <div class="border border-secondary-subtle rounded-3 p-3 bg-light shadow-sm">
                            <div class="form-label fw-semibold text-secondary">Escolha o serviço</div>
                            {{ form.servico }}
                        </div>
                        <div class="d-flex flex-wrap justify-content-start align-items-center gap-3 border border-secondary-subtle rounded-3 p-3 bg-light shadow-sm">
                            <div>
                                <label class="form-label fw-semibold text-secondary">Roupa</label>
                                {{ form.roupa }}
                            </div>
                            <div>
                                <label class="form-label fw-semibold text-secondary">Tecido</label>
                                {{ form.tecido }}
                            </div>
                        </div>
                        <div class="col-12 border border-secondary-subtle rounded-3 p-3 bg-light shadow-sm">
                            <label class="form-label fw-semibold text-secondary">Data de Entrega / Conclusão</label>
                            {{ form.data_conclusao }}
                        </div>
                        <div class="col-12 border border-secondary-subtle rounded-3 p-3 bg-light shadow-sm">
                            <label class="form-label fw-semibold text-secondary">Detalhes adicionais</label>
                            {{ form.detalhes }}
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light border-top-0 d-flex w-100 gap-2 m-0 p-3">
                    <button type="submit" class="btn btn-primary col">Enviar Pedido</button>
                </div>
            </form>
        </div>
    </div>
</div>
